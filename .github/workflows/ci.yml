name: CI

on:
  push:
    branches: [main, v4.0]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild libraries and check for drift
        run: python tools/build.py --check

      - name: Validate library XML files
        run: |
          python - <<'EOF'
          import glob, html, json, sys
          import xml.etree.ElementTree as ET
          failures = []
          for path in sorted(glob.glob("color/*.xml")):
              raw = open(path, encoding="utf-8").read().strip()
              if not (raw.startswith("<mxlibrary>") and raw.endswith("</mxlibrary>")):
                  failures.append(f"{path}: missing <mxlibrary> wrapper")
                  continue
              try:
                  entries = json.loads(raw[len("<mxlibrary>"):-len("</mxlibrary>")])
              except json.JSONDecodeError as e:
                  failures.append(f"{path}: invalid JSON ({e})")
                  continue
              titles = [e.get("title", "") for e in entries]
              dupes = {t for t in titles if titles.count(t) > 1}
              if dupes:
                  failures.append(f"{path}: duplicate titles {sorted(dupes)}")
              for e in entries:
                  if "xml" in e:
                      try:
                          ET.fromstring(html.unescape(e["xml"]))
                      except ET.ParseError as err:
                          failures.append(f"{path}: group '{e.get('title')}': malformed mxGraphModel ({err})")
                  elif "data" in e:
                      if not e["data"].startswith("data:image/svg+xml;base64,"):
                          failures.append(f"{path}: icon '{e.get('title')}': not a base64 SVG data URI")
                  else:
                      failures.append(f"{path}: entry '{e.get('title')}': no data or xml field")
              print(f"{path}: {len(entries)} entries OK")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("All libraries valid.")
          EOF
